name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - run: pip install ruff
    - name: Lint tracked Python files
      run: git ls-files -z '*.py' | xargs -0 ruff check

  tests-ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
        pandas-version: ['latest']
        include:
          - python-version: '3.12'
            pandas-version: '2.2.3'

    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-pip-${{ hashFiles('**/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-py${{ matrix.python-version }}-pandas${{ matrix.pandas-version }}-pip-

    - name: Install Dependencies
      run: pip install -e ".[dev]"

    - name: Pin pandas ${{ matrix.pandas-version }}
      if: matrix.pandas-version != 'latest'
      run: pip install "pandas==${{ matrix.pandas-version }}"

    - name: Display Environment Information
      run: |
        python -c "import platform; print('Python:', platform.python_version(), '|', platform.system(), platform.release())"
        python -c "import Capricho; print('capricho version:', Capricho.__version__)"
        python -c "import pandas; print('pandas version:', pandas.__version__)"
        python -c "import rdkit; print('rdkit version:', rdkit.__version__)"

    - name: Run tests
      run: pytest -xv tests/ --junitxml="test_report.xml"

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        report_paths: 'test_report.xml'

  tests-platform:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install Dependencies
      run: pip install -e ".[dev]"

    - name: Display Environment Information
      run: |
        python -c "import platform; print('Python:', platform.python_version(), '|', platform.system(), platform.release())"
        python -c "import Capricho; print('capricho version:', Capricho.__version__)"
        python -c "import rdkit; print('rdkit version:', rdkit.__version__)"

    - name: Run tests
      run: pytest -xv tests/ --junitxml="test_report.xml"

    - name: Publish Test Report
      uses: mikepenz/action-junit-report@v4
      if: success() || failure()
      with:
        report_paths: 'test_report.xml'
