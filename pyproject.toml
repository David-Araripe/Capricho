[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capricho"
dynamic = ["version"]
description = "Transparent, flexible and reproducible ChEMBL data curation, aggregation and analysis."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["ChEMBL", "drug discovery", "QSAR", "cheminformatics", "activity curation"]
authors = [{ name = "David Araripe", email = "david@araripe.nl" }]
maintainers = [{ name = "David Araripe", email = "david@araripe.nl" }]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "chem-filters >= 1.0.0",
  "chembl_webresource_client",
  "chembl_downloader",
  "tabulate",
  "pandas >= 2.2.3",
  "numpy",
  "loguru",
  "matplotlib",
  "scipy",
  "tqdm",
  "joblib",
  "rdkit >= 2022.09.1",
  "pyarrow",
  "typer",
  "job-tqdflex",
  "jinja2",
  ]

[project.optional-dependencies]
dev = ["ruff", "isort", "black", "pytest"]
docs = [
  "sphinx>=7.0",
  "furo",
  "myst-parser>=3.0",
  "sphinx-autodoc-typehints",
]

[project.urls]
homepage = "https://github.com/David-Araripe/Capricho"
repository = "https://github.com/David-Araripe/Capricho"
documentation = "https://capricho.readthedocs.io/en/latest/"

[project.scripts]
capricho = "Capricho.cli.main:app"

[tool.setuptools_scm]
write_to = "src/Capricho/_version.py"

[tool.setuptools.dynamic]
version = {attr = "Capricho.__version__"}

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "UP", "B", "YTT", "RUF"]
# Scientific symbols are intentional; StrEnum changes str()/format() of public enums.
ignore = ["RUF001", "RUF002", "RUF003", "UP042"]

[tool.ruff.lint.per-file-ignores]
# Typer evaluates these defaults when constructing the CLI.
"src/Capricho/cli/main.py" = ["B008"]
# This concrete base class is also directly usable by existing callers.
"src/Capricho/unichem.py" = ["B024"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 110
target-version = ['py311']
exclude = '''
(
    asv_bench/env
  | \.egg
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | setup.py
)
'''
