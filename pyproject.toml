[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capricho"
dynamic = ["version"]
description = "Transparent, flexible and reproducible ChEMBL data curation, aggregation and analysis."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["ChEMBL", "drug discovery", "QSAR", "cheminformatics", "activity curation"]
authors = [{ name = "David Araripe", email = "david@araripe.nl" }]
maintainers = [{ name = "David Araripe", email = "david@araripe.nl" }]
classifiers = [
  # "TODO",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

dependencies = [
  "chem-filters >= 1.0.0",
  "chembl_webresource_client",
  "chembl_downloader",
  "tabulate",
  "pandas >= 2.2.3",
  "numpy",
  "loguru",
  "scipy",
  "tqdm",
  "joblib",
  "rdkit >= 2022.09.1",
  "pyarrow",
  "typer",
  "job-tqdflex",
  "jinja2",
  ]

[project.optional-dependencies]
pubchem = ["pubchempy>=1.0.5"]  # 1.0.5 renamed the Compound SMILES properties
dev = ["ruff", "isort", "black", "pytest", "pubchempy>=1.0.5"]
docs = [
  "sphinx>=7.0",
  "furo",
  "myst-parser>=3.0",
  "sphinx-autodoc-typehints",
]

[project.urls]
homepage = "https://github.com/David-Araripe/Capricho"
repository = "https://github.com/David-Araripe/Capricho"
documentation = "https://capricho.readthedocs.io/en/latest/"

[project.scripts]
capricho = "Capricho.cli.main:app"

[tool.setuptools_scm]
write_to = "src/Capricho/_version.py"

[tool.setuptools.dynamic]
version = {attr = "Capricho.__version__"}

[tool.ruff]
line-length = 110
target-version = "py39"
fix = true
ignore = ['E501'] # sometimes it goes longer on the docstrings...

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.isort]
profile = "black"

[tool.black]
line-length = 110
target-version = ['py39']
exclude = '''
(
    asv_bench/env
  | \.egg
  | \.git
  | \.hg
  | \.mypy_cache
  | \.nox
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
  | setup.py
)
'''
